[project]
name = "trace-engine"
version = "0.1.0"
description = "Deterministic codebase understanding with AI-assisted reasoning"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "networkx>=3.0",
    # 0.26.0 crashes the interpreter when the position of a node past line
    # 256 is read (Point.row hands out its value without taking a reference).
    "tree-sitter>=0.25.0,<0.26",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
dev = [
    "httpx>=0.27",
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
trace = "trace_engine.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trace_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
