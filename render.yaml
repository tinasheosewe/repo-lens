services:
  - type: web
    name: repolens
    runtime: python
    plan: free
    region: oregon
    rootDir: .
    buildCommand: |
      pip install -e ".[web]"
      cd web
      npm ci
      npm run build
    startCommand: uvicorn trace_engine.api.server:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: TRACE_REPO_PATH
        value: https://github.com/miguelgrinberg/flasky.git
      - key: OPENAI_API_KEY
        sync: false
      - key: TRACE_LLM_MODEL
        value: gpt-4.1-mini